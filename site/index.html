<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">

<title>Maquettes Seddo Mobilité</title>
<style>img{max-width:100%}[hidden]{display:none!important}body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Mise en page : en-tête marque, onglets produits, appareil à gauche et parcours numéroté à droite ; backoffice dans un cadre navigateur défilant. */
:root {
  --bg: #F5F2EE; --surface: #FFFFFF; --fg: #1A1512; --muted: #6E655C; --line: #E3DDD5;
  --accent: #FF5F00; --accent-ink: #B84400; --accent-soft: #FFE7D6;
  --display: "Anton", "Impact", "Arial Narrow", sans-serif;
  --body: "Barlow", "Helvetica Neue", Arial, sans-serif;
  --num: "Barlow Condensed", "Arial Narrow", sans-serif;
  /* Produit : app client (claire) */
  --c-bg: #FFFFFF; --c-ink: #141210; --c-sub: #6F6963; --c-line: #ECE8E3; --c-soft: #F4F1ED;
  --c-ok: #128A4F; --c-ok-soft: #E2F4EA; --c-red: #D2302A; --c-red-soft: #FBE6E5;
  /* Produit : app chauffeur (sombre) */
  --d-bg: #111111; --d-card: #1C1C1C; --d-card2: #262626; --d-ink: #F6F4F1; --d-sub: #A29C95; --d-line: #303030; --d-ok: #3DCB86;
  /* Produit : backoffice */
  --b-bg: #F7F6F4; --b-surface: #FFFFFF; --b-ink: #191613; --b-sub: #6C665F; --b-line: #E6E2DC; --b-side: #17130F; --b-side-ink: #CFC8BF;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #15120F; --surface: #1F1B17; --fg: #F2ECE5; --muted: #A89E93; --line: #36302A;
  --accent: #FF6B17; --accent-ink: #FF9A5C; --accent-soft: #3A2414; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #15120F; --surface: #1F1B17; --fg: #F2ECE5; --muted: #A89E93; --line: #36302A;
  --accent: #FF6B17; --accent-ink: #FF9A5C; --accent-soft: #3A2414; color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.45; }
.wrap { max-width: 1240px; margin: 0 auto; padding-block: 28px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, [data-go]:focus-visible, .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* En-tête */
.head { display: flex; flex-wrap: wrap; gap: 20px; align-items: center; justify-content: space-between; }
.brand { display: flex; gap: 14px; align-items: center; }
.logo { width: 56px; height: 56px; background: #FF5F00; border-radius: 6px; display: grid; place-items: center; color: #FFFFFF; font-family: var(--display); font-size: 14px; letter-spacing: .01em; flex: none; }
.brand h1 { font-family: var(--display); font-weight: 400; font-size: clamp(26px, 4vw, 36px); line-height: 1; margin: 0; letter-spacing: .005em; text-wrap: balance; }
.brand p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
.tabs { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px; flex-wrap: wrap; }
.tab { border: 0; background: transparent; padding: 8px 16px; border-radius: 999px; font-weight: 600; font-size: 14px; color: var(--muted); }
.tab[aria-selected="true"] { background: var(--fg); color: var(--bg); }

/* Zone produit */
.stage { margin-top: 28px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 40px; align-items: start; }
.flow h2 { font-family: var(--display); font-weight: 400; font-size: 26px; margin: 0 0 4px; letter-spacing: .01em; }
.flow .lead { margin: 0 0 18px; color: var(--muted); max-width: 60ch; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; counter-reset: s; }
.steps li button { width: 100%; text-align: left; display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; align-items: start; background: transparent; border: 1px solid transparent; border-radius: 10px; padding: 10px 12px; }
.steps li button:hover { background: var(--surface); border-color: var(--line); }
.steps li button[aria-current="true"] { background: var(--surface); border-color: var(--accent); }
.steps .n { font-family: var(--num); font-weight: 700; font-size: 15px; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--line); color: var(--fg); font-variant-numeric: tabular-nums; }
.steps [aria-current="true"] .n { background: var(--accent); color: #FFFFFF; }
.steps strong { display: block; font-size: 15px; }
.steps .grp { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 14px 12px 4px; }
.steps .grp:first-child { padding-top: 0; }
@media (min-width: 861px) { .phone { position: sticky; top: calc(16px + env(safe-area-inset-top, 0px)); } }
.steps span.d { display: block; color: var(--muted); font-size: 13.5px; }
.nav { display: flex; gap: 8px; margin-top: 18px; }
.btn-o { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 16px; font-weight: 600; font-size: 14px; }
.hint { margin-top: 14px; font-size: 13px; color: var(--muted); }

/* Téléphone */
.phone { width: 340px; max-width: 100%; height: 720px; border-radius: 44px; background: #0B0B0B; padding: 10px; box-shadow: 0 30px 60px -30px rgba(40, 20, 0, .45); }
.screen { position: relative; width: 100%; height: 100%; border-radius: 34px; overflow: hidden; font-family: var(--body); }
.light { background: var(--c-bg); color: var(--c-ink); --m-land: #EEEAE3; --m-road: #FFFFFF; --m-major: #F7D7BF; --m-water: #CBE1EA; --m-park: #D9E6CF; --m-route: #141210; }
.dark { background: var(--d-bg); color: var(--d-ink); --m-land: #1A1C1F; --m-road: #2A2D31; --m-major: #3A3631; --m-water: #0E2630; --m-park: #1C2A1E; --m-route: #FF5F00; }
.status { position: absolute; top: 0; left: 0; right: 0; height: 40px; display: flex; justify-content: space-between; align-items: center; padding: 0 26px; font-weight: 600; font-size: 13px; z-index: 5; }
.status i { display: inline-block; width: 22px; height: 10px; border: 1.5px solid currentColor; border-radius: 3px; position: relative; }
.status i::after { content: ""; position: absolute; inset: 1.5px 5px 1.5px 1.5px; background: currentColor; border-radius: 1px; }
.mapsvg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--c-bg); border-radius: 24px 24px 0 0; padding: 10px 18px 20px; box-shadow: 0 -10px 30px rgba(0, 0, 0, .12); z-index: 4; }
.dark .sheet { background: var(--d-card); box-shadow: 0 -10px 30px rgba(0, 0, 0, .5); }
.grab { width: 38px; height: 4px; border-radius: 2px; background: var(--c-line); margin: 0 auto 12px; }
.dark .grab { background: var(--d-line); }
.topbar { position: absolute; top: 46px; left: 14px; right: 14px; display: flex; justify-content: space-between; z-index: 4; }
.round { width: 40px; height: 40px; border-radius: 50%; background: var(--c-bg); display: grid; place-items: center; box-shadow: 0 4px 12px rgba(0, 0, 0, .15); border: 0; font-weight: 700; }
.dark .round { background: var(--d-card); color: var(--d-ink); }
.t-big { font-family: var(--display); font-weight: 400; font-size: 26px; line-height: 1.05; letter-spacing: .01em; }
.t-h { font-weight: 700; font-size: 18px; line-height: 1.2; }
.t-s { font-size: 13px; color: var(--c-sub); }
.dark .t-s { color: var(--d-sub); }
.num { font-family: var(--num); font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.search { display: flex; align-items: center; gap: 10px; background: var(--c-soft); border-radius: 14px; padding: 14px; font-weight: 600; font-size: 16px; margin-top: 10px; border: 0; width: 100%; text-align: left; }
.sq { width: 10px; height: 10px; background: var(--accent); flex: none; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c-ink); flex: none; }
.row { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--c-line); }
.dark .row { border-color: var(--d-line); }
.row:last-child { border-bottom: 0; }
.ico { width: 36px; height: 36px; border-radius: 50%; background: var(--c-soft); display: grid; place-items: center; flex: none; font-size: 15px; }
.dark .ico { background: var(--d-card2); }
.grow { flex: 1; min-width: 0; }
.cta { display: block; width: 100%; border: 0; border-radius: 14px; padding: 15px; background: var(--accent); color: #FFFFFF; font-weight: 700; font-size: 16px; text-align: center; }
.cta.ink { background: var(--c-ink); }
.cta.ghost { background: var(--c-soft); color: var(--c-ink); }
.dark .cta.ghost { background: var(--d-card2); color: var(--d-ink); }
.cta.ok { background: var(--d-ok); color: #0B1F14; }
.chip { white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 600; }
.chip.ok { background: var(--c-ok-soft); color: var(--c-ok); }
.chip.or { background: #FFE7D6; color: #A63D00; }
.chip.dk { background: var(--d-card2); color: var(--d-ink); }
.tabbar { display: flex; justify-content: space-around; border-top: 1px solid var(--c-line); margin: 14px -18px -20px; padding: 10px 0 14px; font-size: 11.5px; color: var(--c-sub); font-weight: 600; }
.tabbar span { display: grid; justify-items: center; gap: 3px; }
.tabbar b { width: 18px; height: 18px; border-radius: 5px; border: 2px solid currentColor; display: block; }
.tabbar .on { color: var(--accent); }
.opt { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 14px; border: 2px solid transparent; }
.opt.sel { border-color: var(--c-ink); background: var(--c-soft); }
.carimg { width: 54px; height: 30px; flex: none; }
.pay { display: flex; align-items: center; gap: 10px; padding: 10px 0; font-weight: 600; font-size: 14px; }
.omb { width: 32px; height: 22px; border-radius: 5px; background: #141210; color: #FFFFFF; font-size: 10px; font-weight: 700; display: grid; place-items: center; letter-spacing: .02em; }
.scrim { position: absolute; inset: 0; background: rgba(0, 0, 0, .45); z-index: 3; }
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 12px; }
.keypad span { text-align: center; padding: 9px 0; font-family: var(--num); font-size: 22px; font-weight: 600; border-radius: 10px; }
.pins { display: flex; justify-content: center; gap: 14px; margin: 14px 0 4px; }
.pins i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--c-ink); }
.pins i.f { background: var(--c-ink); }
.plate { white-space: nowrap; flex: none; display: inline-block; border: 2px solid var(--c-ink); border-radius: 6px; padding: 2px 8px; font-family: var(--num); font-weight: 700; letter-spacing: .06em; font-size: 15px; }
.code { display: flex; gap: 6px; }
.code span { width: 34px; height: 42px; border-radius: 10px; background: var(--c-ink); color: #FFFFFF; display: grid; place-items: center; font-family: var(--num); font-weight: 700; font-size: 24px; }
.acts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; }
.acts span { display: grid; justify-items: center; gap: 4px; font-size: 11.5px; font-weight: 600; color: var(--c-sub); }
.acts b { width: 44px; height: 44px; border-radius: 50%; background: var(--c-soft); display: grid; place-items: center; color: var(--c-ink); font-size: 15px; }
.dark .acts span { color: var(--d-sub); }
.dark .acts b { background: var(--d-card2); color: var(--d-ink); }
.acts .sos b { background: var(--c-red-soft); color: var(--c-red); }
.stars { display: flex; gap: 6px; justify-content: center; font-size: 30px; color: #F2A300; }
.stars .off { color: var(--c-line); }
.dark .stars .off { color: var(--d-line); }
.split { display: grid; gap: 6px; font-size: 14px; }
.split div { display: flex; justify-content: space-between; gap: 12px; }
.split div > :last-child { white-space: nowrap; }
.full { position: absolute; inset: 0; padding: 56px 20px 20px; display: flex; flex-direction: column; }
.pulse { transform-origin: center; animation: pulse 1.8s ease-out infinite; }
@keyframes pulse { from { r: 8; opacity: .55; } to { r: 46; opacity: 0; } }
.ring { width: 66px; height: 66px; flex: none; }
.bar-prog { height: 4px; border-radius: 2px; background: var(--c-line); overflow: hidden; margin: 12px 0; }
.bar-prog i { display: block; height: 100%; width: 45%; background: var(--accent); border-radius: 2px; animation: prog 1.6s ease-in-out infinite alternate; }
@keyframes prog { from { transform: translateX(-60%); } to { transform: translateX(180%); } }
@keyframes radar { from { r: 10; opacity: .45; } to { r: 120; opacity: 0; } }
.radar { animation: radar 2.4s ease-out infinite; }
@keyframes drift { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(3px, -5px); } }
.drift { animation: drift 4s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) { .pulse, .bar-prog i, .radar, .drift { animation: none; } }
.lc { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; display: inline-block; vertical-align: middle; }
.ico .lc { display: block; }
.search2 { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; background: var(--c-soft); border-radius: 999px; padding: 14px 18px; margin: 12px 0 2px; font-weight: 700; font-size: 18px; text-align: left; color: var(--c-ink); }
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 8px; }
.tiles span { background: var(--c-soft); border-radius: 12px; padding: 8px 4px 8px; display: grid; justify-items: center; align-content: center; gap: 4px; font-size: 12px; font-weight: 600; min-height: 72px; text-align: center; }
.tiles .carimg { width: 48px; height: 26px; }
.mapcard { position: relative; height: 230px; border-radius: 14px; overflow: hidden; margin-top: 12px; }
.tabbar2 { position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-around; background: var(--c-bg); border-top: 1px solid var(--c-line); padding: 8px 0 16px; z-index: 6; }
.tabbar2 span { display: grid; justify-items: center; gap: 2px; font-size: 11.5px; font-weight: 600; color: var(--c-sub); cursor: pointer; }
.tabbar2 span.on { color: var(--c-ink); }
.tabbar2 span.on .lc { stroke-width: 2.4; }
.mini { border: 0; background: var(--c-soft); border-radius: 12px; padding: 10px 6px; display: grid; justify-items: center; gap: 4px; font-size: 12.5px; font-weight: 600; color: var(--c-ink); }
.sim { display: block; width: 100%; border: 0; background: none; margin-top: 8px; font-size: 12.5px; color: var(--c-sub); text-decoration: underline; }
.caret { display: inline-block; width: 2px; height: 17px; background: #FF5F00; vertical-align: middle; margin-left: 2px; }
.itin { border: 1px solid var(--c-line); border-radius: 14px; padding: 12px; margin-top: 10px; }
.act { border: 1px solid var(--c-line); border-radius: 14px; overflow: hidden; margin-top: 8px; cursor: pointer; }
.act-map { position: relative; height: 84px; }
.stars span { display: flex; }
.stars .off { color: var(--c-line); }

/* Backoffice */
.desk-scroll { margin-top: 18px; overflow-x: auto; border-radius: 14px; }
.desk { width: 1180px; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); background: var(--b-bg); color: var(--b-ink); box-shadow: 0 30px 60px -40px rgba(40, 20, 0, .45); }
.chrome { height: 34px; background: #E9E5E0; display: flex; align-items: center; gap: 7px; padding: 0 14px; }
.chrome i { width: 11px; height: 11px; border-radius: 50%; background: #CFC8C0; }
.chrome span { margin-left: 18px; background: #FFFFFF; border-radius: 6px; padding: 3px 12px; font-size: 12px; color: #6C665F; }
.app { display: grid; grid-template-columns: 210px minmax(0, 1fr); min-height: 700px; }
.side { background: var(--b-side); color: var(--b-side-ink); padding: 18px 12px; display: flex; flex-direction: column; gap: 2px; }
.side .lg { display: flex; align-items: center; gap: 10px; color: #FFFFFF; font-weight: 700; margin: 0 6px 18px; }
.side .lg .logo { width: 34px; height: 34px; font-size: 8.5px; border-radius: 4px; }
.side button { border: 0; background: transparent; color: var(--b-side-ink); text-align: left; padding: 9px 10px; border-radius: 8px; font-size: 14px; font-weight: 500; display: flex; justify-content: space-between; }
.side button[aria-current="true"] { background: #2C2520; color: #FFFFFF; }
.side button em { font-style: normal; background: #FF5F00; color: #FFFFFF; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px; }
.side .sep { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #8C8379; margin: 14px 10px 4px; }
.main { padding: 22px 26px; display: grid; gap: 18px; align-content: start; }
.mh { display: flex; justify-content: space-between; align-items: end; }
.mh h3 { margin: 0; font-size: 22px; font-weight: 700; }
.mh p { margin: 2px 0 0; color: var(--b-sub); font-size: 13.5px; }
.card { background: var(--b-surface); border: 1px solid var(--b-line); border-radius: 12px; padding: 16px; min-width: 0; }
.card h4 { margin: 0 0 10px; font-size: 14px; font-weight: 700; }
.kpis { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
.kpi .l { font-size: 12.5px; color: var(--b-sub); font-weight: 600; }
.kpi .v { font-family: var(--num); font-weight: 700; font-size: 30px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.kpi .s { font-size: 12.5px; color: var(--b-sub); }
.up { color: #128A4F; font-weight: 600; } .warn { color: #B26A00; font-weight: 600; } .crit { color: #C42B25; font-weight: 600; }
.g2 { display: grid; grid-template-columns: 1.4fr 1fr; gap: 14px; }
.g3 { display: grid; grid-template-columns: 1.6fr 1fr; gap: 14px; }
table.t { width: 100%; border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums; }
.t th { text-align: left; font-size: 12px; color: var(--b-sub); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--b-line); }
.t td { padding: 9px 10px; border-bottom: 1px solid var(--b-line); }
.t td:nth-child(-n+4), .t td:last-child, .t td[style*="right"], .t td .pill, .t td .bbtn { white-space: nowrap; }
.t.a td:nth-child(3), .t.a td:last-child { white-space: normal; }
.t tr.on td { background: #FFF3EA; }
.pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; }
.p-ok { background: #E2F4EA; color: #12703F; } .p-run { background: #E7EEFB; color: #2852A8; } .p-warn { background: #FFF1D6; color: #8A5400; } .p-crit { background: #FBE6E5; color: #B0241F; } .p-mute { background: #EFECE8; color: #5E5850; }
.alert { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--b-line); font-size: 13.5px; }
.alert:last-child { border: 0; }
.stripe { width: 4px; border-radius: 2px; flex: none; }
.tl { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; font-size: 13px; }
.tl li { display: grid; grid-template-columns: 54px 14px minmax(0, 1fr); gap: 8px; padding-bottom: 10px; position: relative; }
.tl li::before { content: ""; position: absolute; left: 68px; top: 12px; bottom: -2px; width: 2px; background: var(--b-line); }
.tl li:last-child::before { display: none; }
.tl .tm { color: var(--b-sub); font-family: var(--num); font-weight: 600; }
.tl .bul { width: 12px; height: 12px; border-radius: 50%; background: var(--b-ink); margin-top: 3px; z-index: 1; }
.tl .bul.o { background: #FF5F00; }
.tl .bul.g { background: #128A4F; }
.field { display: grid; gap: 4px; font-size: 13px; }
.field label { font-weight: 600; color: var(--b-sub); font-size: 12.5px; }
.inp { border: 1px solid var(--b-line); border-radius: 8px; padding: 8px 10px; background: #FFFFFF; font-family: var(--num); font-size: 16px; font-weight: 600; display: flex; justify-content: space-between; }
.bbtn { border: 0; border-radius: 8px; padding: 8px 14px; font-weight: 600; font-size: 13.5px; background: #FF5F00; color: #FFFFFF; }
.bbtn.s { background: #EFECE8; color: var(--b-ink); }
.bbtn.r { background: #FBE6E5; color: #B0241F; }
.docs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.doc { border: 1px solid var(--b-line); border-radius: 10px; overflow: hidden; background: #FFFFFF; }

.srch { display: flex; align-items: center; gap: 6px; background: #FFFFFF; border: 1px solid var(--b-line); border-radius: 8px; padding: 0 10px; color: var(--b-sub); min-width: 280px; }
.srch .fi { border: 0; padding: 8px 0; min-width: 240px; outline: none; }
.fi { font: inherit; font-size: 13.5px; color: var(--b-ink); background: #FFFFFF; border: 1px solid var(--b-line); border-radius: 8px; padding: 7px 10px; }

textarea.fi { width: 100%; resize: vertical; font-family: var(--body); }
.bulk { display: flex; gap: 10px; align-items: center; background: #FFF3EA; border: 1px solid #F7C8A6; border-radius: 8px; padding: 8px 12px; font-size: 13.5px; }
.lnk { border: 0; background: none; color: #B84400; font-weight: 600; font-size: 13px; padding: 2px 4px; }

.chipb em { font-style: normal; color: var(--b-sub); margin-left: 4px; }

.merr { background: #FBE6E5; color: #B0241F; border-radius: 8px; padding: 8px 10px; font-size: 13px; font-weight: 600; }
.mact { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
.toast { position: absolute; z-index: 30; right: 20px; bottom: 20px; background: #17130F; color: #FFFFFF; border-radius: 10px; padding: 12px 16px; font-size: 14px; display: flex; gap: 8px; align-items: center; box-shadow: 0 10px 30px rgba(0, 0, 0, .3); max-width: 460px; }
.msgs { display: grid; gap: 8px; margin-bottom: 10px; max-height: 240px; overflow: auto; }

.alert.sel { background: #FFF3EA; margin: 0 -16px; padding: 10px 16px; }
.tl .bul.rr { background: #C42B25; }

pre.code { margin: 0; background: #17130F; color: #F2ECE5; border-radius: 8px; padding: 10px; font-size: 12px; overflow: auto; }
.side { position: relative; }

.charte { margin-top: 28px; display: grid; gap: 28px; }

.sw b { display: block; height: 70px; }

.typo { display: grid; gap: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
.typo .lab { font-size: 12px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.comp { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
.comp .light { padding: 16px; border-radius: 14px; border: 1px solid var(--line); width: 300px; max-width: 100%; display: grid; gap: 10px; }
.note { color: var(--muted); font-size: 14px; max-width: 70ch; margin: 0; }

@media (max-width: 860px) {
  .stage { grid-template-columns: minmax(0, 1fr); justify-items: center; }
  .flow { width: 100%; }

  function charteView() {
    var sw = [['#FF5F00', 'Orange Seddo', 'Actions principales, destination'], ['#B84400', 'Orange foncé', 'Texte orange sur blanc'], ['#141210', 'Encre', 'Textes, bouton secondaire'], ['#F4F1ED', 'Sable', 'Fonds de champs et cartes'], ['#128A4F', 'Vert', 'Paiement reçu, versé'], ['#D2302A', 'Rouge', 'SOS, erreurs'], ['#111111', 'Nuit', 'Fond app chauffeur']];
    return '<section class="charte"><div class="ch"><h3>Couleurs</h3><div class="sw">' + sw.map(function (c) { return '<div><b style="background:' + c[0] + '"></b><span><strong>' + c[1] + '</strong><em>' + c[0] + '</em>' + c[2] + '</span></div>'; }).join('') + '</div></div>' +
      '<div class="ch"><h3>Typographie</h3><div class="typo"><div><div class="lab">Titres et marque · Anton</div><div style="font-family:var(--display);font-size:40px;line-height:1.1">Où allez-vous ?</div></div>' +
      '<div><div class="lab">Montants et chiffres · Barlow Condensed</div><div class="num" style="font-size:40px">3 500 FCFA · 4 min · ★ 4,9</div></div>' +
      '<div><div class="lab">Texte courant · Barlow</div><div style="max-width:60ch">Votre chauffeur arrive dans 4 minutes. Donnez-lui le code de départ affiché à l\'écran pour démarrer la course.</div></div></div></div>' +
      '<div class="ch"><h3>Composants</h3><div class="comp"><div class="light"><button class="cta">Commander Seddo Eco · 3 500 F</button><button class="cta ink">Valider</button><button class="cta ghost">Annuler</button></div>' +
      '<div class="light"><div style="display:flex;gap:6px;flex-wrap:wrap"><span class="chip ok">' + ic('check', 14) + 'Paiement reçu</span><span class="chip or">Payé</span><span class="chip" style="background:var(--c-red-soft);color:var(--c-red)">SOS</span></div><button class="search2" style="margin:0">' + ic('search', 22) + '<span>Où allez-vous ?</span></button><div style="display:flex;justify-content:space-between;align-items:center"><span class="plate">DK 4521 AB</span><div class="code"><span>4</span><span>8</span><span>2</span><span>1</span></div></div></div></div></div>' +
      '<div class="ch"><h3>Règles</h3><p class="note">Carte plein écran et panneau qui glisse depuis le bas. Un seul bouton principal orange par écran. Le prix en FCFA est toujours en gros chiffres, avec « Orange Money » visible avant la commande. App chauffeur en thème sombre pour la conduite, gros boutons utilisables d\'une main. Icônes au trait (jeu Lucide), une seule épaisseur. App client sans barre d\'onglets : un menu burger donne accès à Activité, TCU, paiement, lieux, sécurité, langue et aide. Les montants affichés dans ces maquettes sont des exemples.</p></div></section>';
  }
  function render() {
    document.querySelectorAll('.tab').forEach(function (t) { t.setAttribute('aria-selected', t.dataset.tab === state.tab ? 'true' : 'false'); });
    if (state.tab === 'client') view.innerHTML = phoneView(client, 'c', 'light', 'App Client et mini app Max it', 'Le même design sert l\'app Android/iOS et la mini app dans Max it. Parcours complet : commande, paiement Orange Money, course, fin et remboursement en cas d\'annulation.');
    else if (state.tab === 'chauffeur') view.innerHTML = phoneView(driver, 'd', 'dark', 'App Chauffeur', 'Thème sombre pour la conduite. De la mise en ligne au versement automatique sur l\'Orange Money du chauffeur.');
    else if (state.tab === 'backoffice') view.innerHTML = boView();
    else view.innerHTML = charteView();
    try { localStorage.setItem('seddo-maquettes', JSON.stringify(state)); } catch (e) {}
  }
  function keepFocus(fn) {
    var ae = document.activeElement, key = ae && ae.dataset ? ae.dataset.bind : null, pos = null;
    try { pos = ae.selectionStart; } catch (er) { }
    fn();
    if (key) { var el = document.querySelector('[data-bind="' + key + '"]'); if (el) { el.focus(); try { if (pos != null) el.setSelectionRange(pos, pos); } catch (er) { } } }
  }
  document.addEventListener('click', function (e) {
    var a = e.target.closest('.desk [data-act]');
    if (!a || a.disabled) return;
    BO.saveDraft();
    if (BO.act(a)) { e.preventDefault(); keepFocus(render); }
  }, true);
  function onBind(e) {
    var el = e.target.closest && e.target.closest('.desk [data-bind]');
    if (!el) return;
    var discrete = el.tagName === 'SELECT' || el.type === 'checkbox' || el.type === 'date' || el.type === 'datetime-local';
    if (e.type === 'input' && discrete) return;
    if (e.type === 'change' && !discrete) return;
    BO.saveDraft(); BO.bind(el); keepFocus(render);
  }
  document.addEventListener('input', onBind);
  document.addEventListener('change', onBind);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && document.querySelector('.modal')) { var b = document.querySelector('.mscrim'); if (b) b.click(); } });
  document.addEventListener('click', function (e) {
    if (e.target.closest('.desk [data-act]')) return;
    var t = e.target.closest('[data-tab],[data-step],[data-go],[data-bo]');
    if (!t) return;
    if (t.dataset.tab) { state.tab = t.dataset.tab; }
    else if (t.dataset.bo !== undefined) { state.b = +t.dataset.bo; }
    else {
      var raw = t.dataset.step !== undefined ? t.dataset.step : t.dataset.go;
      if (raw === '') return;
      var n = isNaN(+raw) ? client.findIndex(function (x) { return x.id === raw; }) : +raw;
      if (n < 0) return;
      if (state.tab === 'client') state.c = n; else if (state.tab === 'chauffeur') state.d = n;
    }
    render();
  });
  render();
})();
</script>

</body>
</html>
